service: vehicle-service-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    STAGE: ${opt:stage, 'dev'} # Agregar variable de entorno para el stage
    IS_OFFLINE: ${opt:isOffline, 'false'}


apiGateway:
binaryMediaTypes:
  - 'image/jpeg'
  - 'image/png'
  - 'image/gif'
  - 'application/octet-stream'



plugins:
  - serverless-offline


functions:
  LambdaVehicle:
    name: LambdaVehicle-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.createVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicle
          method: post
          cors: true

  GetImageFromVehicle:
    name: GetImageFromVehicle-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getImageFromVehicleHandler
    timeout: 90
    events:
      - http:
          path: /image
          method: get
          cors: true
          queryStringParameters:
            id: true

  GetAllVehicles:
    name: GetAllVehicles-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getAllVehiclesHandler
    timeout: 90
    events:
      - http:
          path: /vehicles
          method: get
          cors: true

  DetailVehicle:
    name: DetailVehicle-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.detailVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicles/{id}
          method: get
          cors: true

  UpdateVehicle:
    name: UpdateVehicle-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.updateVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicles/{id}
          method: patch
          cors: true

  SwaggerDocumentation:
    name: SwaggerDocumentation-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerHandler.handler
    events:
      - http:
          path: /swagger
          method: get
          cors: true

  SwaggerUI:
    name: SwaggerUI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerUIHandler.handler
    events:
      - http:
          path: swagger-ui
          method: any
          cors: true