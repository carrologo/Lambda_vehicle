service: my-serverless-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_KEY: ${env:SUPABASE_KEY}
    API_GATEWAY_ID: ${env:API_GATEWAY_ID} # Agregar variable de entorno para el API Gateway ID
    STAGE: ${opt:stage, 'dev'} # Agregar variable de entorno para el stage


plugins:
  - serverless-offline

functions:
  LambdaVehicle:
    name: LambdaVehicle-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.handler
    events:
      - http:
          path: /vehicle
          method: post
          cors: true
  
  SwaggerDocumentation:
    name: SwaggerDocumentation-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerHandler.handler
    events:
      - http:
          path: /swagger
          method: get
          cors: true

  SwaggerUI:
    name: SwaggerUI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerUIHandler.handler
    events:
      - http:
          path: swagger-ui
          method: get
          cors: true