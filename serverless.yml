service: vehicle-service-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    STAGE: ${opt:stage, 'dev'} # Agregar variable de entorno para el stage
    IS_OFFLINE: ${opt:isOffline, 'false'}

apiGateway:
binaryMediaTypes:
  - "image/jpeg"
  - "image/png"
  - "image/gif"
  - "application/octet-stream"

plugins:
  - serverless-offline

functions:
  VehicleAPI:
    name: VehicleAPI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.createVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicle
          method: post
          cors: true
  
  listVehicles:
    name: VehicleAPI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getAllVehiclesHandler
    timeout: 90
    events:
      - http:
          path: /vehicles
          method: get
          cors: true
  
  getVehicleById:
    name: VehicleAPI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getDetailVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicles/{id}
          method: get
          cors: true
  
  updateVehicleById:
    name: VehicleAPI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.updateVehicleHandler
    timeout: 90
    events:
      - http:
          path: /vehicles/{id}
          method: patch
          cors: true

  getImage:
    name: VehicleAPI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getImageVehicleHandler
    timeout: 90
    events:
      - http:
          path: /image
          method: get
          cors: true
    

  SwaggerDocumentation:
    name: SwaggerDocumentation-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerHandler.handler
    events:
      - http:
          path: /swagger
          method: get
          cors: true

  SwaggerUI:
    name: SwaggerUI-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/swaggerUIHandler.handler
    events:
      - http:
          path: swagger-ui
          method: any
          cors: true

